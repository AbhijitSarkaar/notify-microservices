
services:

  db:
    container_name: db
    image: sqldb
    environment: 
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - notify-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 10s
      start_period: 5s
      retries: 5

  
  order-service:
    container_name: order-service
    build:
      context: ./order-service
      dockerfile: Dockerfile 
    ports:
      - "8082:8082"
    environment: 
      - spring.application.name=order-service 
    networks: 
      - notify-network


  auth-service:
    container_name: auth-service
    build: 
      context: ./auth-service 
      dockerfile: Dockerfile 
    ports: 
      - "8081:8081"
    environment: 
      - spring.application.name=auth-service 
    networks:
      - notify-network 
    depends_on:
      db:
        condition: service_healthy
        restart: true 


  gateway:
    container_name: gateway
    image: nginx 
    ports: 
      - "8000:80"
    networks:
      - notify-network
    depends_on:
      auth-service:
        condition: service_started
      order-service:
        condition: service_started


networks:
  notify-network:
    
